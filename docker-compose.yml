version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api-gateway:
    build: ./Microservices/api-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AUTH_SERVICE_URL=http://auth-service:5002
      - BOOKING_SERVICE_URL=http://booking-service:5003
      - PATIENT_SERVICE_URL=http://patient-service:5004
      - DOCTOR_SERVICE_URL=http://doctor-service:5005
      - ADMIN_SERVICE_URL=http://admin-service:5001
    depends_on:
      - auth-service
      - booking-service
      - patient-service
      - doctor-service
      - admin-service

  auth-service:
    build: ./Microservices/auth-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGODB_URI=mongodb://mongodb:27017/medical_system_auth
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret}
    depends_on:
      - mongodb

  admin-service:
    build: ./Microservices/admin-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/medical_system_admin
    depends_on:
      - mongodb

  booking-service:
    build: ./Microservices/booking-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGODB_URI=mongodb://mongodb:27017/medical_system_booking
    depends_on:
      - mongodb

  patient-service:
    build: ./Microservices/patient-service
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - MONGODB_URI=mongodb://mongodb:27017/medical_system_patient
    depends_on:
      - mongodb

  doctor-service:
    build: ./Microservices/doctor-service
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGODB_URI=mongodb://mongodb:27017/medical_system_doctor
    depends_on:
      - mongodb

  client:
    build: ./Microservices/client
    ports:
      - "8080:80"
    depends_on:
      - api-gateway

volumes:
  mongo_data:
